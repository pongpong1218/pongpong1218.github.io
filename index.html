<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>po | Portfolio</title>

  <style>
    /* 全体の基本設定 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ページ全体のデザイン */
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #fafafa;
      color: #222;
      line-height: 1.8;
    }

    /* ヘッダー */
    header {
      background-color: #fff;
      border-bottom: 2px solid #e53935;
      padding: 20px 8%;
    }

    /* ヘッダーの配置 */
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    /* ロゴ */
    .logo {
      color: #e53935;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* ナビゲーション */
    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    /* リンクにマウスを重ねたとき */
    nav a:hover {
      color: #e53935;
    }

    /* メインコンテンツの幅 */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 8%;
    }

    /* 自己紹介のメインエリア */
    .hero {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 80px 0;
      border-bottom: 1px solid #ddd;
    }

    /* 小さな英語タイトル */
    .hero-label {
      color: #e53935;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    /* 名前を大きく表示 */
    .hero h1 {
      font-size: clamp(64px, 12vw, 120px);
      color: #222;
      line-height: 1.2;
      letter-spacing: -3px;
    }

    /* 名前の下の赤いライン */
    .red-line {
      width: 70px;
      height: 5px;
      background-color: #e53935;
      margin: 25px 0;
    }

    /* キャッチコピー */
    .catchcopy {
      font-size: 24px;
      font-weight: bold;
      color: #e53935;
    }

    /* 各セクション共通 */
    section {
      padding: 70px 0;
    }

    /* セクションタイトル */
    .section-title {
      font-size: 28px;
      margin-bottom: 30px;
      border-left: 5px solid #e53935;
      padding-left: 15px;
    }

    /* 自己紹介カード */
    .profile-card {
      background-color: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 35px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    /* プロフィール情報の1行 */
    .profile-row {
      display: flex;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
      gap: 20px;
    }

    /* 最後の行は線を表示しない */
    .profile-row:last-child {
      border-bottom: none;
    }

    /* 項目名 */
    .profile-label {
      width: 100px;
      flex-shrink: 0;
      color: #777;
      font-weight: bold;
    }

    /* プロフィールの内容 */
    .profile-value {
      color: #222;
      font-weight: bold;
    }

    /* 趣味の表示エリア */
    .hobby-card {
      background-color: #e53935;
      color: #fff;
      border-radius: 8px;
      padding: 45px 35px;
      text-align: center;
    }

    /* 趣味の文字 */
    .hobby-card h3 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .hobby-card p {
      font-size: 14px;
      letter-spacing: 2px;
      opacity: 0.9;
    }

    /* フッター */
    footer {
      background-color: #222;
      color: #fff;
      text-align: center;
      padding: 30px 15px;
      margin-top: 40px;
      font-size: 13px;
    }

    /* スマートフォン向けのデザイン */
    @media screen and (max-width: 600px) {

      /* ヘッダーを縦並びにする */
      .header-inner {
        flex-direction: column;
        gap: 12px;
      }

      header {
        padding: 15px 5%;
      }

      /* メインの左右余白を小さくする */
      main {
        padding: 0 6%;
      }

      /* メインエリアを小さくする */
      .hero {
        min-height: 340px;
        padding: 60px 0;
      }

      .hero h1 {
        font-size: 72px;
      }

      .catchcopy {
        font-size: 20px;
      }

      /* セクションの余白 */
      section {
        padding: 50px 0;
      }

      .section-title {
        font-size: 24px;
      }

      /* カードの余白 */
      .profile-card {
        padding: 20px;
      }

      .profile-label {
        width: 75px;
      }

      .hobby-card {
        padding: 35px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー：サイト名とナビゲーション -->
  <header>
    <div class="header-inner">

      <div class="logo">po.</div>

      <!-- ページ内の各項目へ移動するリンク -->
      <nav>
        <a href="#home">HOME</a>
        <a href="#about">ABOUT</a>
        <a href="#hobby">HOBBY</a>
      </nav>

    </div>
  </header>

  <!-- メインコンテンツ -->
  <main>

    <!-- トップページ：名前とキャッチコピー -->
    <div class="hero" id="home">

      <p class="hero-label">MY PORTFOLIO</p>

      <h1>po.</h1>

      <!-- 赤い装飾ライン -->
      <div class="red-line"></div>

      <!-- 自己紹介に書かれているキャッチコピー -->
      <p class="catchcopy">pongpong</p>

    </div>

    <!-- 基本情報 -->
    <section id="about">

      <h2 class="section-title">About Me</h2>

      <div class="profile-card">

        <!-- 名前 -->
        <div class="profile-row">
          <span class="profile-label">名前</span>
          <span class="profile-value">po</span>
        </div>

        <!-- 学年 -->
        <div class="profile-row">
          <span class="profile-label">学年</span>
          <span class="profile-value">3年</span>
        </div>

        <!-- 学部 -->
        <div class="profile-row">
          <span class="profile-label">学部</span>
          <span class="profile-value">工学部</span>
        </div>

      </div>

    </section>

    <!-- 趣味・好きなこと -->
    <section id="hobby">

      <h2 class="section-title">My Hobby</h2>

      <div class="hobby-card">

        <!-- 趣味を大きく表示 -->
        <h3>ゲーム</h3>

        <p>GAME</p>

      </div>

    </section>

  </main>

  <!-- フッター：ページの最後に表示 -->
  <footer>
    <p>po. | My Portfolio</p>
  </footer>

</body>
</html>
